<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TaskFlow</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 24px;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111111);
    }

    .card {
      max-width: 480px;
      margin: 40px auto;
      padding: 24px;
      border-radius: 16px;
      background: var(--tg-theme-secondary-bg-color, #f3f3f3);
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.05);
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>TaskFlow</h1>

    <p id="message">
      در حال اتصال به Telegram...
    </p>

    <div id="debug" class="status">
      Loading...
    </div>
  </div>

  <script>
    function initTelegram() {
      const debug = document.getElementById("debug");
      const message = document.getElementById("message");

      try {
        if (!window.Telegram) {
          message.textContent = "Telegram object پیدا نشد ❌";
          debug.textContent =
            "window.Telegram = undefined";
          return;
        }

        if (!window.Telegram.WebApp) {
          message.textContent = "Telegram WebApp پیدا نشد ❌";
          debug.textContent =
            "window.Telegram.WebApp = undefined";
          return;
        }

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;

        if (user) {
          message.textContent =
            `سلام ${user.first_name || ""} 👋`;
        } else {
          message.textContent =
            "Telegram متصل است ولی اطلاعات User دریافت نشد.";
        }

        debug.textContent =
          "WebApp: true\n" +
          "Platform: " + tg.platform + "\n" +
          "Version: " + tg.version + "\n" +
          "InitData length: " + (tg.initData?.length || 0) + "\n" +
          "User available: " + Boolean(user);

      } catch (error) {
        message.textContent = "خطای JavaScript ❌";
        debug.textContent =
          error?.stack || error?.message || String(error);
      }
    }

    window.addEventListener("load", initTelegram);
  </script>

</body>
</html>
