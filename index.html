<!doctype html>

<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>TaskFlow Storage Test</title>

  <script src="./telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        var(
          --tg-theme-bg-color,
          #ffffff
        );

      color:
        var(
          --tg-theme-text-color,
          #111111
        );
    }

    .container {
      max-width: 540px;
      margin: 24px auto;
    }

    .card {
      padding: 22px;

      border-radius: 20px;

      background:
        var(
          --tg-theme-secondary-bg-color,
          #f2f2f2
        );
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 28px;
      font-size: 18px;
    }

    .subtitle {
      color:
        var(
          --tg-theme-hint-color,
          #777
        );

      line-height: 1.7;

      font-size: 14px;
    }

    button {
      width: 100%;

      padding: 14px;

      margin-top: 10px;

      border: none;

      border-radius: 13px;

      cursor: pointer;

      font-size: 15px;

      background:
        var(
          --tg-theme-button-color,
          #2481cc
        );

      color:
        var(
          --tg-theme-button-text-color,
          #fff
        );
    }

    button.secondary {
      background: #666;
    }

    button.danger {
      background: #b3261e;
    }

    .result {
      margin-top: 18px;

      padding: 14px;

      min-height: 80px;

      border-radius: 14px;

      direction: ltr;

      text-align: left;

      white-space: pre-wrap;

      word-break: break-word;

      background:
        rgba(0, 0, 0, 0.07);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size: 13px;

      line-height: 1.6;
    }

    .success {
      color: #14833b;
    }

    .error {
      color: #c62828;
    }

    .info-box {
      padding: 12px;

      margin-top: 16px;

      border-radius: 12px;

      background:
        rgba(0, 0, 0, 0.05);

      line-height: 1.8;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="card">

      <h1>
        TaskFlow
      </h1>

      <div
        id="user-info"
        class="subtitle"
      >
        در حال اتصال به Telegram...
      </div>


      <div class="info-box">

        <strong>
          Storage Test
        </strong>

        <br />

        Project:
        <b>Personal</b>

        <br />

        Task:
        <b>خرید شیر</b>

        <br />

        Due:
        <b>فردا 18:00</b>

      </div>


      <h2>
        Telegram CloudStorage
      </h2>


      <button
        id="save-button"
      >
        💾 ذخیره داده آزمایشی
      </button>


      <button
        id="load-button"
        class="secondary"
      >
        📥 خواندن داده
      </button>


      <button
        id="keys-button"
        class="secondary"
      >
        🔑 نمایش کلیدها
      </button>


      <button
        id="delete-button"
        class="danger"
      >
        🗑 پاک کردن داده
      </button>


      <div
        id="status"
        class="result"
      >
        Ready.
      </div>

    </div>

  </div>


  <script>

    const tg =
      window.Telegram?.WebApp;

    const status =
      document.getElementById(
        "status"
      );

    const userInfo =
      document.getElementById(
        "user-info"
      );


    // -----------------------------
    // Test data
    // -----------------------------

    const STORAGE_KEY =
      "taskflow_test_v1";


    const testData = {

      version: 1,

      project: {
        id: "personal",
        name: "Personal",
        type: "personal"
      },

      task: {
        id: "test_task_001",
        project_id: "personal",
        title: "خرید شیر",
        due: "tomorrow 18:00",
        status: "open"
      },

      saved_at:
        new Date().toISOString()

    };


    function show(
      message,
      type
    ) {

      status.className =
        "result";

      if (type === "success") {
        status.classList.add(
          "success"
        );
      }

      if (type === "error") {
        status.classList.add(
          "error"
        );
      }

      status.textContent =
        message;
    }


    function formatError(error) {

      if (!error) {
        return "Unknown error";
      }

      if (
        typeof error === "string"
      ) {
        return error;
      }

      try {
        return JSON.stringify(
          error,
          null,
          2
        );
      }
      catch (_) {
        return String(error);
      }

    }


    function initialize() {

      if (!tg) {

        userInfo.textContent =
          "❌ Telegram WebApp پیدا نشد.";

        show(
          "window.Telegram.WebApp is unavailable",
          "error"
        );

        return;
      }


      tg.ready();

      try {
        tg.expand();
      }
      catch (_) {}


      const user =
        tg.initDataUnsafe?.user;


      if (user) {

        userInfo.textContent =
          `✅ سلام ${user.first_name || ""} — Telegram connected`;

      }

      else {

        userInfo.textContent =
          "⚠️ Telegram متصل است ولی user موجود نیست.";

      }


      show(
        [
          "Telegram connected: true",

          "Platform: " +
            tg.platform,

          "Version: " +
            tg.version,

          "CloudStorage available: " +
            Boolean(
              tg.CloudStorage
            )

        ].join("\n")
      );

    }


    // -----------------------------
    // SAVE
    // -----------------------------

    function saveData() {

      if (!tg?.CloudStorage) {

        show(
          "CloudStorage unavailable.",
          "error"
        );

        return;
      }


      const value =
        JSON.stringify(
          testData
        );


      show(
        "Saving..."
      );


      tg.CloudStorage.setItem(
        STORAGE_KEY,
        value,
        function (
          error,
          stored
        ) {

          if (error) {

            show(
              "SAVE ERROR:\n" +
              formatError(error),
              "error"
            );

            return;
          }


          show(
            [
              "SAVE SUCCESS ✅",

              "Stored: " +
                stored,

              "Key: " +
                STORAGE_KEY,

              "",

              value

            ].join("\n"),
            "success"
          );

        }
      );

    }


    // -----------------------------
    // LOAD
    // -----------------------------

    function loadData() {

      if (!tg?.CloudStorage) {

        show(
          "CloudStorage unavailable.",
          "error"
        );

        return;
      }


      show(
        "Loading..."
      );


      tg.CloudStorage.getItem(
        STORAGE_KEY,

        function (
          error,
          value
        ) {

          if (error) {

            show(
              "LOAD ERROR:\n" +
              formatError(error),
              "error"
            );

            return;
          }


          if (!value) {

            show(
              "No stored value found."
            );

            return;
          }


          let parsed;


          try {

            parsed =
              JSON.parse(value);

          }

          catch (_) {

            parsed =
              value;

          }


          show(
            "LOAD SUCCESS ✅\n\n" +
            JSON.stringify(
              parsed,
              null,
              2
            ),
            "success"
          );

        }
      );

    }


    // -----------------------------
    // KEYS
    // -----------------------------

    function loadKeys() {

      show(
        "Loading keys..."
      );


      tg.CloudStorage.getKeys(
        function (
          error,
          keys
        ) {

          if (error) {

            show(
              "GET KEYS ERROR:\n" +
              formatError(error),
              "error"
            );

            return;
          }


          show(
            "KEYS ✅\n\n" +
            JSON.stringify(
              keys,
              null,
              2
            ),
            "success"
          );

        }
      );

    }


    // -----------------------------
    // DELETE
    // -----------------------------

    function deleteData() {

      show(
        "Deleting..."
      );


      tg.CloudStorage.removeItem(
        STORAGE_KEY,

        function (
          error,
          removed
        ) {

          if (error) {

            show(
              "DELETE ERROR:\n" +
              formatError(error),
              "error"
            );

            return;
          }


          show(
            [
              "DELETE SUCCESS ✅",

              "Removed: " +
                removed

            ].join("\n"),
            "success"
          );

        }
      );

    }


    // -----------------------------
    // Events
    // -----------------------------

    document
      .getElementById(
        "save-button"
      )
      .addEventListener(
        "click",
        saveData
      );


    document
      .getElementById(
        "load-button"
      )
      .addEventListener(
        "click",
        loadData
      );


    document
      .getElementById(
        "keys-button"
      )
      .addEventListener(
        "click",
        loadKeys
      );


    document
      .getElementById(
        "delete-button"
      )
      .addEventListener(
        "click",
        deleteData
      );


    window.addEventListener(
      "load",
      initialize
    );

  </script>

</body>

</html>
